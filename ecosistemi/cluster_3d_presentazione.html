        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background-color: #000; color: #fff; }
        #map { width: 100vw; height: 100vh; }

        .custom-marker {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white; width: 34px; height: 34px; border-radius: 50%;
            border: 2px solid #ffffff; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer; transition: transform 0.2s;
        }
        .custom-marker.first-marker { background: linear-gradient(135deg, #3b82f6, #1d4ed8) !important; }
        .custom-marker:hover { transform: scale(1.2); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center; z-index: 100;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card {
            background: #1e293b; border: 1px solid #334155; width: 92%; max-width: 900px;
            max-height: 90vh; border-radius: 14px; padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); overflow-y: auto;
            display: flex; flex-direction: column; gap: 14px;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 12px; }
        .modal-header h3 { font-size: 1.25rem; color: #38bdf8; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        
        .btn-action {
            background: #0284c7; color: #fff; border: none; padding: 8px 14px;
            border-radius: 6px; cursor: pointer; font-size: 0.88rem; font-weight: 600;
            transition: background 0.2s;
        }
        .btn-action:hover { background: #0369a1; }
        .btn-action.btn-cancel { background: #64748b; }
        .btn-action.btn-cancel:hover { background: #475569; }

        .close-btn { background: none; border: none; color: #94a3b8; font-size: 1.8rem; cursor: pointer; line-height: 1; }
        .close-btn:hover { color: #fff; }
        
        .coords-badge {
            background: #0f172a; border: 1px solid #334155; padding: 8px 12px;
            border-radius: 6px; font-size: 0.85rem; color: #38bdf8; display: inline-block;
            margin-bottom: 12px;
        }

        .modal-body-text { font-size: 1rem; color: #cbd5e1; line-height: 1.6; white-space: pre-wrap; margin-bottom: 12px; }

        .media-preview { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        .media-preview img, .media-preview iframe, .media-preview video {
            width: 100%; height: 450px; border-radius: 8px; object-fit: cover; border: 1px solid #334155; background: #000;
        }
        .media-preview img { height: auto; max-height: 450px; }

        .btn-media-link {
            display: block; padding: 12px 18px; color: #fff; text-decoration: none; border-radius: 6px; font-weight: 600; text-align: center; font-size: 0.95rem; margin-top: 4px;
        }
        .btn-video-link { background: #cc181e; }
        .btn-video-link:hover { background: #b31217; }
        .btn-external-link { background: #0284c7; }
        .btn-external-link:hover { background: #0369a1; }

        .edit-form { display: none; flex-direction: column; gap: 12px; margin-top: 10px; }
        .edit-form.active { display: flex; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.85rem; color: #94a3b8; font-weight: 600; }
        .form-group input, .form-group textarea, .form-group select {
            background: #0f172a; border: 1px solid #334155; color: #fff; padding: 10px;
            border-radius: 6px; font-size: 0.95rem; font-family: inherit;
        }
        .form-group textarea { min-height: 100px; resize: vertical; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn-save { background: #22c55e; color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-save:hover { background: #16a34a; }
    </style>

    <div id="map"></div>

    <div id="modal" class="modal-overlay">

            <div class="modal-header">
                <h3 id="view-title"></h3>
                <div class="header-actions">
                    <button class="btn-action" id="toggle-edit-btn" onclick="requestEditAccess()">✏️ Modifica</button>
                    <button class="close-btn" onclick="closeModal()">&times;</button>
                </div>
            </div>
            
            <!-- Vista Lettura -->
            <div id="view-mode-content"></div>

            <!-- Form di Modifica -->
            <form id="edit-form" class="edit-form" onsubmit="submitEdit(event)">
                <input type="hidden" id="edit-number" name="marker_number">
                
                <div class="form-group">
                    <label>Titolo Marcatore</label>
                    <input type="text" id="edit-title" name="title" required>
                </div>

                <div class="form-group">
                    <label>Descrizione / Testo</label>
                    <textarea id="edit-text" name="text"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>URL Immagine</label>
                        <input type="url" id="edit-image" name="image" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label>URL Video (YouTube / MP4)</label>
                        <input type="url" id="edit-video" name="video" placeholder="https://...">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Modalità Video</label>
                        <select id="edit-videoMode" name="videoMode">
                            <option value="embed">Incorporato (Embed)</option>
                            <option value="external">Link Esterno</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>URL Sito Web / Tour Virtuale</label>
                        <input type="url" id="edit-webUrl" name="webUrl" placeholder="https://...">
                    </div>
                </div>

                <div class="form-group">
                    <label>Modalità Web</label>
                    <select id="edit-webMode" name="webMode">
                        <option value="external">Link Esterno</option>
                        <option value="embed">Incorporato (Embed)</option>
                    </select>
                </div>

                <button type="submit" class="btn-save">💾 Salva & Scarica JSON Aggiornato</button>
            </form>
        </div>
    </div>

        const initialView = DATA.initialView || { center: [16.3500, 38.9000], zoom: 7.8, pitch: 25, bearing: 0 };
        const MARKERS_DATA = DATA.markers || DATA;

        const map = new maplibregl.Map({
            container: 'map',
            zoom: initialView.zoom,
            center: initialView.center,
            pitch: initialView.pitch,
            bearing: initialView.bearing,
            style: {
                version: 8,
                sources: {
                    'esri-sat': {
                        type: 'raster',
                        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
                        tileSize: 256
                    },
                    'terrain': {
                        type: 'raster-dem',
                        tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
                        encoding: 'terrarium', tileSize: 256, maxzoom: 15
                    }
                },
                layers: [{ id: 'sat-layer', type: 'raster', source: 'esri-sat' }],
                terrain: { source: 'terrain', exaggeration: 1.4 }
            }
        });

        map.addControl(new maplibregl.NavigationControl());

        function extractYouTubeId(url) {
            if (!url) return null;
            const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
            const match = url.match(regExp);
            return match ? match[1] : null;
        }

        map.on('load', () => {
            MARKERS_DATA.forEach((data, index) => {
                const el = document.createElement('div');
                el.className = 'custom-marker';
                if (index === 0) el.classList.add('first-marker');
                el.innerText = data.number || (index + 1);

                new maplibregl.Marker({ element: el })
                    .setLngLat(data.coords)
                    .addTo(map);

                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showDetails(data);
                });
            });
        });

        function showDetails(data) {
            currentMarkerData = data;
            
            document.getElementById('view-title').innerText = `Marcatore #${data.number} - ${data.title || 'Senza Titolo'}`;
            
            const content = document.getElementById('view-mode-content');
            content.innerHTML = '';

            if (data.coords && data.coords.length === 2) {
                const coordsDiv = document.createElement('div');
                coordsDiv.className = 'coords-badge';
                coordsDiv.innerHTML = `📍 <strong>Coordinate GPS:</strong> Lat ${data.coords[1]}, Lng ${data.coords[0]}`;
                content.appendChild(coordsDiv);
            }

            if (data.text) {
                const p = document.createElement('p');
                p.className = 'modal-body-text';
                p.innerText = data.text;
                content.appendChild(p);
            }

            const mediaDiv = document.createElement('div');
            mediaDiv.className = 'media-preview';

            if (data.image && data.image.trim() !== '') {
                const img = document.createElement('img');
                img.src = data.image;
                img.alt = data.title;
                img.onerror = () => img.style.display = 'none';
                mediaDiv.appendChild(img);
            }

            if (data.video && data.video.trim() !== '') {
                if (data.videoMode === 'external') {
                    const videoBtn = document.createElement('a');
                    videoBtn.href = data.video;
                    videoBtn.target = '_blank';
                    videoBtn.className = 'btn-media-link btn-video-link';
                    videoBtn.innerText = '▶️ Apri Video Esterno / YouTube';
                    mediaDiv.appendChild(videoBtn);
                } else {
                    const ytId = extractYouTubeId(data.video);
                    if (ytId) {
                        const iframe = document.createElement('iframe');
                        iframe.src = 'https://www.youtube-nocookie.com/embed/' + ytId;
                        iframe.setAttribute('allowfullscreen', 'true');
                        iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
                        mediaDiv.appendChild(iframe);
                    } else {
                        const video = document.createElement('video');
                        video.src = data.video;
                        video.controls = true;
                        mediaDiv.appendChild(video);
                    }
                }
            }

            if (data.webUrl && data.webUrl.trim() !== '') {
                if (data.webMode === 'embed') {
                    const iframe = document.createElement('iframe');
                    iframe.src = data.webUrl;
                    mediaDiv.appendChild(iframe);
                } else {
                    const linkBtn = document.createElement('a');
                    linkBtn.href = data.webUrl;
                    linkBtn.target = '_blank';
                    linkBtn.className = 'btn-media-link btn-external-link';
                    linkBtn.innerText = '🌐 Apri Tour Virtuale / Sito Web';
                    mediaDiv.appendChild(linkBtn);
                }
            }

            content.appendChild(mediaDiv);

            document.getElementById('edit-number').value = data.number;
            document.getElementById('edit-title').value = data.title || '';
            document.getElementById('edit-text').value = data.text || '';
            document.getElementById('edit-image').value = data.image || '';
            document.getElementById('edit-video').value = data.video || '';
            document.getElementById('edit-videoMode').value = data.videoMode || 'embed';
            document.getElementById('edit-webUrl').value = data.webUrl || '';
            document.getElementById('edit-webMode').value = data.webMode || 'external';

            setEditFormVisible(false);
            document.getElementById('modal').classList.add('active');
        }

        function requestEditAccess() {
            const form = document.getElementById('edit-form');
            const isEditing = form.classList.contains('active');

            if (isEditing) {
                setEditFormVisible(false);
                return;
            }

            if (!isEditorAuthenticated) {
                const pass = prompt("Inserisci la password per modificare questa scheda:");
                if (pass === EDITOR_PASSWORD) {
                    isEditorAuthenticated = true;
                    setEditFormVisible(true);
                } else if (pass !== null) {
                    alert("Password errata!");
                }
            } else {
                setEditFormVisible(true);
            }
        }

        function setEditFormVisible(showForm) {
            const form = document.getElementById('edit-form');
            const view = document.getElementById('view-mode-content');
            const btn = document.getElementById('toggle-edit-btn');

            if (showForm) {
                form.classList.add('active');
                view.style.display = 'none';
                btn.innerText = '👁️ Torna alla Vista';
                btn.classList.add('btn-cancel');
            } else {
                form.classList.remove('active');
                view.style.display = 'block';
                btn.innerText = '✏️ Modifica';
                btn.classList.remove('btn-cancel');
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        async function submitEdit(event) {
            event.preventDefault();
            
            const formData = {
                number: parseInt(document.getElementById('edit-number').value),
                title: document.getElementById('edit-title').value,
                text: document.getElementById('edit-text').value,
                image: document.getElementById('edit-image').value,
                video: document.getElementById('edit-video').value,
                videoMode: document.getElementById('edit-videoMode').value,
                webUrl: document.getElementById('edit-webUrl').value,
                webMode: document.getElementById('edit-webMode').value
            };

            // 1. Aggiorna la struttura dati locale
            if (currentMarkerData) {
                Object.assign(currentMarkerData, formData);
            }
            const markerInList = DATA.markers.find(m => m.number === formData.number);
            if (markerInList) {
                Object.assign(markerInList, formData);
            }

            // 2. Genera la stringa JSON completa dell'intera mappa
            const jsonString = JSON.stringify(DATA, null, 2);

            // 3. AVVIA IL DOWNLOAD AUTOMATICO DEL FILE .JSON NEL BROWSER
            const jsonBlob = new Blob([jsonString], { type: 'application/json' });
            const downloadUrl = URL.createObjectURL(jsonBlob);
            const link = document.createElement('a');
            link.href = downloadUrl;
            link.download = `mappa_calabria_configuratore.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(downloadUrl);

            // 4. Invia la mail di notifica con backup in FormSubmit
            const emailPayload = {
                _subject: `[Mappa Calabria 3D] Modifica Marcatore #${formData.number}`,
                _replyto: "noreply@unical.it",
                _template: "box",
                marcatore_modificato: formData.number,
                nuovo_titolo: formData.title,
                JSON_COMPLETO_BACKUP: jsonString
            };

            try {
                const response = await fetch("https://formsubmit.co/ajax/pietro.pantano@unical.it", {
                    method: "POST",
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(emailPayload)
                });

                if (response.ok) {
                    alert("✅ Modifica salvata!\n\n1. Il file 'mappa_calabria_configuratore.json' è stato scaricato nei tuoi Download.\n2. La notifica mail è stata inviata con successo.");
                } else {
                    alert("✅ Modifica salvata e file scaricato nei Download.");
                }
            } catch (error) {
                console.error("Errore invio mail:", error);
                alert("✅ Modifica salvata e file scaricato nei Download.");
            }

            showDetails(currentMarkerData);
        }
    </script>
