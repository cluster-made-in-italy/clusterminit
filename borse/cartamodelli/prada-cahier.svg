" cy="247" r="1.2" fill="#b4603e"/><text x="249" y="245" font-size="3.6" fill="#263a3c">R2</text><circle cx="47" cy="247" r="1.2" fill="#b4603e"/><text x="49" y="245" font-size="3.6" fill="#263a3c">R3</text><polygon points="294.00,100.00 508.00,100.00 508.00,254.00 294.00,254.00" fill="#f6efe2" stroke="#253a3c" stroke-width=".55"/><polygon points="301.00,107.00 501.00,107.00 501.00,247.00 301.00,247.00" fill="none" stroke="#b4603e" stroke-width=".5" stroke-dasharray="3 2"/><text x="301" y="265" font-size="6" fill="#263a3c">B · RETRO — tagliare 1 + eventuale fodera</text><path d="M401,149v53.2" stroke="#4b7976" stroke-width=".6" marker-end="url(#arrow)"/><text x="406" y="177" font-size="4" fill="#263a3c">direzione materiale</text><circle cx="301" cy="107" r="1.2" fill="#b4603e"/><text x="303" y="105" font-size="3.6" fill="#263a3c">R0</text><circle cx="501" cy="107" r="1.2" fill="#b4603e"/><text x="503" y="105" font-size="3.6" fill="#263a3c">R1</text><circle cx="501" cy="247" r="1.2" fill="#b4603e"/><text x="503" y="245" font-size="3.6" fill="#263a3c">R2</text><circle cx="301" cy="247" r="1.2" fill="#b4603e"/><text x="303" y="245" font-size="3.6" fill="#263a3c">R3</text><rect x="40" y="297" width="694" height="94" fill="#edf3ee" stroke="#253a3c" stroke-width=".55"/><rect x="47" y="304" width="680" height="80" fill="none" stroke="#b4603e" stroke-width=".5" stroke-dasharray="3 2"/><path d="M47,304v80" stroke="#668c87" stroke-width=".3" stroke-dasharray="2 2"/><text x="49" y="309" font-size="3.5" fill="#263a3c">R0</text><path d="M247,304v80" stroke="#668c87" stroke-width=".3" stroke-dasharray="2 2"/><text x="249" y="309" font-size="3.5" fill="#263a3c">R1</text><path d="M387,304v80" stroke="#668c87" stroke-width=".3" stroke-dasharray="2 2"/><text x="389" y="309" font-size="3.5" fill="#263a3c">R2</text><path d="M587,304v80" stroke="#668c87" stroke-width=".3" stroke-dasharray="2 2"/><text x="589" y="309" font-size="3.5" fill="#263a3c">R3</text><path d="M67.4,344h144" stroke="#5f5b93" stroke-width="1.5"/><text x="40" y="404" font-size="6" fill="#263a3c">C · FASCIA CONTINUA — linea cucitura 680.0 × 80.0 mm; unire estremità corte. Tratto viola: apertura zip di studio.</text><rect x="40" y="423" width="1200" height="39" fill="#f7f2e7" stroke="#253a3c" stroke-width=".55"/><path d="M40,442.5h1200" stroke="#668c87" stroke-width=".4" stroke-dasharray="3 3"/><text x="40" y="474" font-size="6" fill="#263a3c">D · TRACOLLA OPZIONALE — lunghezza 1200 mm, larghezza finita 25 mm; adattare attacchi e rinforzi al prototipo.</text></g></svg>