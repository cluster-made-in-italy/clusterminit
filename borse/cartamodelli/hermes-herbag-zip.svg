<svg xmlns="http://www.w3.org/2000/svg" width="1280.00mm" height="745.00mm" viewBox="0 0 1280 745"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0L6,3 0,6Z" fill="#4b7976"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif"><text x="40" y="20" font-size="11" fill="#263a3c">FORME / Hermès · Herbag Zip</text><text x="40" y="33" font-size="7" fill="#263a3c">RICOSTRUZIONE GEOMETRICA DIDATTICA — non cartamodello originale né replica di produzione.</text><text x="40" y="45" font-size="6" fill="#263a3c">Ingombro L × H × P: 31 × 25 × 10 cm · dati: ipotesi di studio · margine nominale 7 mm.</text><text x="40" y="56" font-size="5.5" fill="#263a3c">Contorno scuro: taglio approssimato; arancio: cucitura; verde: riferimenti. Provare prima in tela. Verificare margini nelle concavità.</text><text x="40" y="67" font-size="5.5" fill="#263a3c">La fascia misura il perimetro campionato dei pannelli. Rinforzi, fodera, spessori e chiusure di marca non sono ricostruiti.</text><rect x="1205" y="20" width="50" height="50" fill="none" stroke="#263a3c" stroke-width=".5"/><text x="1206" y="78" font-size="4" fill="#263a3c">CONTROLLO 50 × 50 mm</text><polygon points="81.34,100.00 322.66,100.00 365.22,364.00 38.78,364.00" fill="#f6efe2" stroke="#253a3c" stroke-width=".55"/><polygon points="87.30,107.00 316.70,107.00 357.00,357.00 47.00,357.00" fill="none" stroke="#b4603e" stroke-width=".5" stroke-dasharray="3 2"/><text x="47" y="375" font-size="6" fill="#263a3c">A · FRONTE — tagliare 1 + eventuale fodera</text><path d="M202,182v95" stroke="#4b7976" stroke-width=".6" marker-end="url(#arrow)"/><text x="207" y="232" font-size="4" fill="#263a3c">direzione materiale</text><circle cx="87.30000000000001" cy="107" r="1.2" fill="#b4603e"/><text x="89.30000000000001" y="105" font-size="3.6" fill="#263a3c">R0</text><circle cx="316.7" cy="107" r="1.2" fill="#b4603e"/><text x="318.7" y="105" font-size="3.6" f