 stroke="#5f5b93" stroke-width="1.5"/><text x="40" y="484" font-size="6" fill="#263a3c">C · FASCIA CONTINUA — linea cucitura 1000.0 × 100.0 mm; unire estremità corte. Tratto viola: apertura zip di studio.</text><rect x="40" y="503" width="1200" height="39" fill="#f7f2e7" stroke="#253a3c" stroke-width=".55"/><path d="M40,522.5h1200" stroke="#668c87" stroke-width=".4" stroke-dasharray="3 3"/><text x="40" y="554" font-size="6" fill="#263a3c">D · TRACOLLA OPZIONALE — lunghezza 1200 mm, larghezza finita 25 mm; adattare attacchi e rinforzi al prototipo.</text></g></svg>