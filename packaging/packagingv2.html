<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Packaging Studio - Pentawards Edition</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Montserrat:wght@400;700&family=Playfair+Display:wght@600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Three.js + OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: #161616;
            --accent-color: #d4af37;
            --text-color: #f0f0f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Sidebar Controlli */
        .sidebar {
            width: 380px;
            min-width: 380px;
            background-color: var(--panel-bg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            overflow-y: auto;
            height: 100vh;
            z-index: 10;
        }

        .sidebar h1 {
            font-size: 1.1rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .section-title {
            font-size: 0.75rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 6px;
            font-weight: bold;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-row {
            display: flex;
            gap: 8px;
        }

        .control-row .control-group {
            flex: 1;
        }

        .control-group label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #aaa;
            display: flex;
            justify-content: space-between;
        }

        select, input[type="text"], input[type="number"], input[type="color"], input[type="range"] {
            width: 100%;
            padding: 6px 8px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            outline: none;
            font-size: 0.8rem;
        }

        input[type="range"] {
            padding: 0;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        input[type="color"] {
            height: 32px;
            padding: 2px;
            cursor: pointer;
        }

        select:focus, input:focus {
            border-color: var(--accent-color);
        }

        /* Viewport 3D Canvas */
        .viewport {
            flex-grow: 1;
            height: 100vh;
            position: relative;
            background: radial-gradient(circle at center, #222 0%, #050505 100%);
        }

        #webgl-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .canvas-hint {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #ccc;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Dashboard Punteggio Pentawards */
        .evaluation-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid #333;
            padding: 15px;
            border-radius: 8px;
            width: 280px;
        }

        .evaluation-panel h3 {
            font-size: 0.85rem;
            color: var(--accent-color);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .metric { margin-bottom: 6px; }

        .metric-title {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            margin-bottom: 2px;
        }

        .progress-bar {
            height: 4px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-color);
            width: 50%;
            transition: width 0.3s ease;
        }

        .feedback-text {
            font-size: 0.7rem;
            margin-top: 8px;
            color: #bbb;
            font-style: italic;
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h1>3D Packaging Studio</h1>
        
        <!-- 1. GEOMETRIA E DIMENSIONI POLIEDRO -->
        <div class="section-title">1. Poliedro & Dimensioni 3D</div>
        
        <div class="control-group">
            <label for="polyhedron">Forma Poliedro</label>
            <select id="polyhedron">
                <option value="cube">Esaedro (Cubo / Scatola)</option>
                <option value="tetrahedron">Tetraedro (Piramide 4 Facce)</option>
                <option value="octahedron">Ottaedro (8 Facce)</option>
                <option value="dodecahedron">Dodecaedro (12 Facce)</option>
                <option value="icosahedron">Icosaedro (20 Facce)</option>
                <option value="hexagonalPrisma">Prisma Esagonale</option>
            </select>
        </div>

        <div class="control-row">
            <div class="control-group">
                <label for="scaleX">Larghezza (X) <span id="valX">1.0</span></label>
                <input type="range" id="scaleX" min="0.5" max="2.2" step="0.05" value="1.0">
            </div>
            <div class="control-group">
                <label for="scaleY">Altezza (Y) <span id="valY">1.0</span></label>
                <input type="range" id="scaleY" min="0.5" max="2.2" step="0.05" value="1.0">
            </div>
            <div class="control-group">
                <label for="scaleZ">Profondità (Z) <span id="valZ">1.0</span></label>
                <input type="range" id="scaleZ" min="0.5" max="2.2" step="0.05" value="1.0">
            </div>
        </div>

        <div class="control-row">
            <div class="control-group">
                <label for="material">Materiale</label>
                <select id="material">
                    <option value="cardboard">Cartone Opaco</option>
                    <option value="kraft">Carta Kraft</option>
                    <option value="glass">Vetro Satinato</option>
                    <option value="metal">Alluminio</option>
                </select>
            </div>
            <div class="control-group">
                <label for="finish">Finitura</label>
                <select id="finish">
                    <option value="matte">Matte Soft-Touch</option>
                    <option value="gloss">Glossy Lucido</option>
                    <option value="metalFoil">Lamina Foil</option>
                </select>
            </div>
        </div>

        <div class="control-group">
            <label for="bgColor">Colore Fondo Scatola</label>
            <input type="color" id="bgColor" value="#122a28">
        </div>

        <!-- 2. TITOLO BRAND & FONT SIZE -->
        <div class="section-title">2. Titolo Brand</div>
        
        <div class="control-group">
            <label for="brandName">Testo Titolo</label>
            <input type="text" id="brandName" value="AURA">
        </div>

        <div class="control-row">
            <div class="control-group">
                <label for="titleFont">Font Titolo</label>
                <select id="titleFont">
                    <option value="'Cinzel', serif">Cinzel (Lusso)</option>
                    <option value="'Playfair Display', serif">Playfair (Serif)</option>
                    <option value="'Montserrat', sans-serif">Montserrat (Minimal)</option>
                    <option value="'Space Mono', monospace">Space Mono (Tech)</option>
                </select>
            </div>
            <div class="control-group">
                <label for="titleSize">Dim. Font (px)</label>
                <input type="number" id="titleSize" value="80" min="20" max="160">
            </div>
            <div class="control-group">
                <label for="titleColor">Colore</label>
                <input type="color" id="titleColor" value="#d4af37">
            </div>
        </div>

        <!-- 3. SOTTOTITOLO & DETTAGLI -->
        <div class="section-title">3. Sottotitolo & Dettagli</div>
        
        <div class="control-group">
            <label for="brandSubtitle">Testo Sottotitolo</label>
            <input type="text" id="brandSubtitle" value="EAU DE PARFUM">
        </div>

        <div class="control-row">
            <div class="control-group">
                <label for="subFont">Font Dettagli</label>
                <select id="subFont">
                    <option value="'Montserrat', sans-serif">Montserrat</option>
                    <option value="'Playfair Display', serif">Playfair</option>
                    <option value="'Cinzel', serif">Cinzel</option>
                    <option value="'Space Mono', monospace">Space Mono</option>
                </select>
            </div>
            <div class="control-group">
                <label for="subSize">Dim. Sub (px)</label>
                <input type="number" id="subSize" value="30" min="10" max="80">
            </div>
        </div>

        <div class="control-group">
            <label for="brandInfo">Info Piè di Pagina</label>
            <input type="text" id="brandInfo" value="50 ML / 1.7 FL. OZ.">
        </div>

        <div class="control-row">
            <div class="control-group">
                <label for="infoSize">Dim. Info (px)</label>
                <input type="number" id="infoSize" value="22" min="8" max="50">
            </div>
            <div class="control-group">
                <label for="subColor">Colore Testi</label>
                <input type="color" id="subColor" value="#e0e0e0">
            </div>
            <div class="control-group">
                <label for="frameColor">Colore Bordo</label>
                <input type="color" id="frameColor" value="#d4af37">
            </div>
        </div>
    </div>

    <!-- Viewport 3D -->
    <div class="viewport">
        <div class="canvas-hint">🖱️ Ruota con il mouse | Scroll per Zoom</div>
        <canvas id="webgl-canvas"></canvas>

        <div class="evaluation-panel">
            <h3>Pentawards Score <span id="scoreTotal">0/100</span></h3>
            
            <div class="metric">
                <div class="metric-title"><span>Shelf Impact (3D Visual)</span><span id="scoreVisual">0%</span></div>
                <div class="progress-bar"><div class="progress-fill" id="barVisual"></div></div>
            </div>

            <div class="metric">
                <div class="metric-title"><span>Sostenibilità Strutturale</span><span id="scoreEco">0%</span></div>
                <div class="progress-bar"><div class="progress-fill" id="barEco"></div></div>
            </div>

            <div class="metric">
                <div class="metric-title"><span>Tipografia & Leggibilità</span><span id="scoreCoherence">0%</span></div>
                <div class="progress-bar"><div class="progress-fill" id="barCoherence"></div></div>
            </div>

            <div class="feedback-text" id="feedbackText">Inizializzazione rendering...</div>
        </div>
    </div>

    <!-- Canvas di supporto per la generazione delle Texture 2D -->
    <canvas id="texture-canvas" width="1024" height="1024" style="display:none;"></canvas>

    <script>
        // Setup Three.js
        const canvas3D = document.getElementById('webgl-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas: canvas3D, antialias: true, alpha: true });
        renderer.setSize(canvas3D.clientWidth, canvas3D.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, canvas3D.clientWidth / canvas3D.clientHeight, 0.1, 100);
        camera.position.set(0, 2, 5);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Luci
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 8, 5);
        scene.add(dirLight);

        let currentMesh = null;
        const texCanvas = document.getElementById('texture-canvas');
        const ctx = texCanvas.getContext('2d');

        // Generazione Dinamica della Texture 2D
        function createTexture() {
            const brand = document.getElementById('brandName').value || '';
            const subtitle = document.getElementById('brandSubtitle').value || '';
            const info = document.getElementById('brandInfo').value || '';

            const titleFont = document.getElementById('titleFont').value;
            const subFont = document.getElementById('subFont').value;

            const titleSize = document.getElementById('titleSize').value;
            const subSize = document.getElementById('subSize').value;
            const infoSize = document.getElementById('infoSize').value;

            const bgCol = document.getElementById('bgColor').value;
            const titleCol = document.getElementById('titleColor').value;
            const subCol = document.getElementById('subColor').value;
            const frameCol = document.getElementById('frameColor').value;

            // Sfondo
            ctx.fillStyle = bgCol;
            ctx.fillRect(0, 0, 1024, 1024);

            // Cornice
            ctx.strokeStyle = frameCol;
            ctx.lineWidth = 12;
            ctx.strokeRect(60, 60, 904, 904);
            ctx.lineWidth = 4;
            ctx.strokeRect(80, 80, 864, 864);

            // Titolo Brand
            ctx.fillStyle = titleCol;
            ctx.textAlign = 'center';
            ctx.font = `bold ${titleSize}px ${titleFont}`;
            ctx.fillText(brand.toUpperCase(), 512, 460);

            // Sottotitolo
            ctx.fillStyle = subCol;
            ctx.font = `${subSize}px ${subFont}`;
            ctx.fillText(subtitle.toUpperCase(), 512, 550);

            // Info
            ctx.font = `${infoSize}px ${subFont}`;
            ctx.fillText(info.toUpperCase(), 512, 860);

            const texture = new THREE.CanvasTexture(texCanvas);
            texture.needsUpdate = true;
            return texture;
        }

        // Geometrie
        function getGeometry(type) {
            switch(type) {
                case 'tetrahedron': return new THREE.TetrahedronGeometry(1.5);
                case 'octahedron': return new THREE.OctahedronGeometry(1.4);
                case 'dodecahedron': return new THREE.DodecahedronGeometry(1.3);
                case 'icosahedron': return new THREE.IcosahedronGeometry(1.3);
                case 'hexagonalPrisma': return new THREE.CylinderGeometry(1.2, 1.2, 2.2, 6);
                case 'cube':
                default: return new THREE.BoxGeometry(1.8, 2.2, 1.8);
            }
        }

        // Aggiornamento Modello 3D
        function updateScene() {
            if (currentMesh) scene.remove(currentMesh);

            const polyType = document.getElementById('polyhedron').value;
            const matType = document.getElementById('material').value;
            const finish = document.getElementById('finish').value;

            const sx = parseFloat(document.getElementById('scaleX').value);
            const sy = parseFloat(document.getElementById('scaleY').value);
            const sz = parseFloat(document.getElementById('scaleZ').value);

            document.getElementById('valX').textContent = sx.toFixed(2);
            document.getElementById('valY').textContent = sy.toFixed(2);
            document.getElementById('valZ').textContent = sz.toFixed(2);

            const geom = getGeometry(polyType);
            const texture = createTexture();

            let roughness = 0.5, metalness = 0.1, clearcoat = 0.0;
            if (matType === 'kraft') { roughness = 0.9; metalness = 0.0; }
            if (matType === 'metal') { roughness = 0.2; metalness = 0.8; }
            if (matType === 'glass') { roughness = 0.1; metalness = 0.1; }

            if (finish === 'gloss') { roughness = 0.1; clearcoat = 1.0; }
            if (finish === 'metalFoil') { metalness = 0.5; }

            const mat = new THREE.MeshPhysicalMaterial({
                map: texture,
                roughness: roughness,
                metalness: metalness,
                clearcoat: clearcoat
            });

            currentMesh = new THREE.Mesh(geom, mat);
            currentMesh.scale.set(sx, sy, sz);
            scene.add(currentMesh);

            evaluateScore();
        }

        // Calcolo Score Pentawards
        function evaluateScore() {
            const poly = document.getElementById('polyhedron').value;
            const mat = document.getElementById('material').value;
            const titleSize = parseInt(document.getElementById('titleSize').value);

            let visual = 65, eco = 50, typographyScore = 80;
            let feedback = "Proporzioni e tipografia ben bilanciate.";

            if (titleSize > 110) {
                typographyScore -= 20;
                feedback = "Attenzione: Il font del titolo è molto grande e potrebbe strabordare dai margini.";
            } else if (titleSize < 35) {
                typographyScore -= 20;
                feedback = "Attenzione: Il font è piccolo, riducendo l'impatto visivo sullo scaffale.";
            }

            if (poly === 'dodecahedron' || poly === 'icosahedron') { visual += 20; eco -= 15; }
            else if (poly === 'cube' || poly === 'hexagonalPrisma') { eco += 25; }

            if (mat === 'kraft') eco += 20;

            visual = Math.min(100, visual);
            eco = Math.max(10, Math.min(100, eco));
            typographyScore = Math.max(10, Math.min(100, typographyScore));
            const total = Math.round((visual + eco + typographyScore) / 3);

            document.getElementById('scoreVisual').textContent = visual + '%';
            document.getElementById('barVisual').style.width = visual + '%';
            document.getElementById('scoreEco').textContent = eco + '%';
            document.getElementById('barEco').style.width = eco + '%';
            document.getElementById('scoreCoherence').textContent = typographyScore + '%';
            document.getElementById('barCoherence').style.width = typographyScore + '%';
            document.getElementById('scoreTotal').textContent = total + '/100';
            document.getElementById('feedbackText').textContent = feedback;
        }

        // Event Listeners
        const ids = [
            'polyhedron', 'scaleX', 'scaleY', 'scaleZ', 'material', 'finish', 'bgColor', 
            'brandName', 'titleFont', 'titleSize', 'titleColor',
            'brandSubtitle', 'subSize', 'brandInfo', 'infoSize', 'subFont', 'subColor', 'frameColor'
        ];

        ids.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('input', updateScene);
                el.addEventListener('change', updateScene);
            }
        });

        // Loop di rendering 3D
        function animate() {
            requestAnimationFrame(animate);
            if (currentMesh) {
                currentMesh.rotation.y += 0.005;
            }
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = canvas3D.clientWidth / canvas3D.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(canvas3D.clientWidth, canvas3D.clientHeight);
        });

        // Avvio Immediato del rendering
        updateScene();
        animate();
    </script>
</body>
</html>
