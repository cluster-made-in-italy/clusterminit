80,539h180" stroke="#5f5b93" stroke-width="1.5"/><text x="40" y="634" font-size="6" fill="#263a3c">C · FASCIA CONTINUA — linea cucitura 1100.0 × 150.0 mm; unire estremità corte. Tratto viola: apertura zip di studio.</text><rect x="40" y="653" width="1200" height="39" fill="#f7f2e7" stroke="#253a3c" stroke-width=".55"/><path d="M40,672.5h1200" stroke="#668c87" stroke-width=".4" stroke-dasharray="3 3"/><text x="40" y="704" font-size="6" fill="#263a3c">D · TRACOLLA OPZIONALE — lunghezza 1200 mm, larghezza finita 25 mm; adattare attacchi e rinforzi al prototipo.</text></g></svg>